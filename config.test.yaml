{
  "name": "xoox",
  "description": "XOOX canonical launch, trade, fee and dividend events",
  "schema": "schema.graphql",
  "handlers": "src/handlers",
  "address_format": "lowercase",
  "field_selection": {
    "transaction_fields": [
      "hash"
    ]
  },
  "contracts": [
    {
      "name": "TradeV3Factory",
      "events": [
        {
          "event": "PoolCreated(address indexed token0,address indexed token1,uint24 indexed fee,int24 tickSpacing,address pool)"
        }
      ]
    },
    {
      "name": "TradeV4PoolManager",
      "events": [
        {
          "event": "Initialize(bytes32 indexed id,address indexed currency0,address indexed currency1,uint24 fee,int24 tickSpacing,address hooks,uint160 sqrtPriceX96,int24 tick)"
        }
      ]
    },
    {
      "name": "Factory",
      "events": [
        {
          "event": "DuoExecutorConfigured(address indexed executor)"
        },
        {
          "event": "DuoConfigured(address indexed token,address indexed secondaryQuote)"
        },
        {
          "event": "DuoLaunched(address indexed token,uint256 primaryAllocation,uint256 secondaryAllocation)"
        },
        {
          "event": "DuoPoolRecorded(address indexed token,bytes32 indexed poolId,uint256 positionId)"
        },
        {
          "event": "BuybackEnabledUpdated(address indexed token,bool enabled)"
        },
        {
          "event": "HolderFeeSharingConfigured(address indexed token,address indexed vault,uint8 mode,uint16 baseShareBps,uint16 taxShareBps)"
        },
        {
          "event": "FeeStrategySnapshotted(address indexed token,bool baseFeeEnabled,uint16 creatorBps,uint16 holderBps,uint16 burnBps,uint16 liquidityBps)"
        },
        {
          "event": "LaunchStakingConfigured(address indexed token,address indexed pool,uint256 totalSupply,uint256 curveAllocation,uint256 rewardAmount,uint32 duration)"
        },
        {
          "event": "TokenLaunched(address indexed token,address indexed curve,address indexed creator,address quoteAsset,uint256 configId)"
        },
        {
          "event": "QuoteAssetUpdated(address indexed asset,bool approved,uint8 decimals)"
        },
        {
          "event": "PairTokenEconomicsUpdated(address indexed asset,uint256 phantomQuote,uint256 graduationThreshold)"
        },
        {
          "event": "GraduationSwept(address indexed token,uint256 quoteAmount,uint256 tokenAmount,uint256 sweptAt)"
        },
        {
          "event": "Graduated(address indexed token,bytes32 indexed poolId,uint256 positionId,uint256 residualTokensLocked)"
        },
        {
          "event": "Rescued(address indexed token,address indexed recipient,uint256 quoteAmount,uint256 tokenAmount)"
        },
        {
          "event": "CreatorFeeRecipientUpdated(address indexed token,address indexed previousRecipient,address indexed recipient)"
        },
        {
          "event": "LaunchEconomicsSnapshotted(address indexed token,uint256 supply,uint256 phantomQuote,uint256 graduationThreshold,uint16 baseBps,uint16 creatorTaxBps,uint16 protocolShareBps,uint16 buybackShareBps,bool buybackEnabled,address dividendVault,uint16 dividendShareBps)"
        }
      ]
    },
    {
      "name": "LaunchRouter",
      "events": [
        {
          "event": "LaunchOptionsConfigured(address indexed token,uint16 buyTaxBps,uint16 sellTaxBps,uint256 minimumHolderBalance,address royaltySplitter,bytes32 optionsHash)"
        }
      ]
    },
    {
      "name": "Curve",
      "events": [
        {
          "event": "CurveBuy(address indexed buyer,address indexed recipient,uint256 tokensOut,uint256 quoteSpent,uint256 quoteRefund,uint256 baseFee,uint256 creatorTax,uint256 snipeTax,uint256 realQuoteReserve,uint256 tokenReserve)"
        },
        {
          "event": "CurveSell(address indexed seller,address indexed recipient,uint256 tokensIn,uint256 quoteOut,uint256 baseFee,uint256 creatorTax,uint256 realQuoteReserve,uint256 tokenReserve)"
        },
        {
          "event": "CurveCompleted(address indexed token,uint256 quoteReserve,uint256 tokenReserve)"
        }
      ]
    },
    {
      "name": "Token",
      "events": [
        {
          "event": "Transfer(address indexed from,address indexed to,uint256 value)"
        },
        {
          "event": "TokenMetadata(string name,string symbol,string image,string description,string website,string twitter,string telegram,uint256 supply)"
        },
        {
          "event": "LiquidityPoolSet(address indexed pool)"
        },
        {
          "event": "DividendVaultSet(address indexed vault)"
        }
      ]
    },
    {
      "name": "FeeVault",
      "events": [
        {
          "event": "FeeStrategyAllocated(address indexed token,address indexed asset,uint256 protocolAmount,uint256 creatorAmount,uint256 holderAmount,uint256 burnAmount,uint256 liquidityAmount)"
        },
        {
          "event": "BurnProcessed(address indexed token,uint256 quoteSpent,uint256 tokensBurned,uint256 quoteRemaining)"
        },
        {
          "event": "LiquidityProcessed(address indexed token,uint256 indexed positionId,uint256 quoteSpent,uint256 tokensBought,uint256 tokensUsed,uint128 liquidityAdded,uint256 quoteRemaining,uint256 tokensRemaining)"
        },
        {
          "event": "BuybackExecutorConfigured(address indexed executor)"
        },
        {
          "event": "FeeCredited(address indexed token,address indexed asset,address indexed beneficiary,uint256 amount)"
        },
        {
          "event": "Claimed(address indexed token,address indexed asset,address indexed beneficiary,uint256 amount)"
        },
        {
          "event": "HolderDividendFunded(address indexed token,address indexed dividendVault,address indexed asset,uint256 amount)"
        }
      ]
    },
    {
      "name": "DividendVault",
      "events": [
        {
          "event": "RewardsDeposited(uint256 indexed epoch,uint256 amount)"
        },
        {
          "event": "DividendClaimed(uint256 indexed epoch,address indexed beneficiary,uint256 amount)"
        },
        {
          "event": "EmptyEpochRolledOver(uint256 indexed sourceEpoch,uint256 indexed targetEpoch,uint256 amount)"
        }
      ]
    },
    {
      "name": "OgDividendVault",
      "events": [
        {
          "event": "OgHolderDisqualified(address indexed account)"
        },
        {
          "event": "OgRewardsDeposited(uint256 amount)"
        },
        {
          "event": "OgRewardsAllocated(uint256 amount,uint256 eligibleSupply)"
        },
        {
          "event": "OgDividendClaimed(address indexed beneficiary,uint256 amount)"
        }
      ]
    },
    {
      "name": "Hook",
      "events": [
        {
          "event": "PoolRegistered(bytes32 indexed poolId,address indexed token)"
        },
        {
          "event": "HookFeesAccrued(address indexed token,address indexed asset,uint256 baseFee,uint256 creatorTax)"
        }
      ]
    },
    {
      "name": "SwapRouter",
      "events": [
        {
          "event": "PoolTrade(address indexed token,address indexed trader,address indexed recipient,bool buy,uint256 amountIn,uint256 amountOut)"
        },
        {
          "event": "DuoPoolTrade(address indexed token,address indexed trader,bytes32 indexed poolId,address recipient,address quoteAsset,bool buy,uint256 amountIn,uint256 amountOut)"
        }
      ]
    },
    {
      "name": "PaymentRouter",
      "events": [
        {
          "event": "RoutedTrade(address indexed token,address indexed trader,address indexed paymentAsset,bool buy,uint8 phase,uint256 quoteAmount,uint256 tokenAmount,uint256 paymentAmount,address refundAsset,uint256 refundAmount)"
        }
      ]
    },
    {
      "name": "PoolManager",
      "events": [
        {
          "event": "Initialize(bytes32 indexed id,address indexed currency0,address indexed currency1,uint24 fee,int24 tickSpacing,address hooks,uint160 sqrtPriceX96,int24 tick)"
        },
        {
          "event": "Swap(bytes32 indexed id,address indexed sender,int128 amount0,int128 amount1,uint160 sqrtPriceX96,uint128 liquidity,int24 tick,uint24 fee)"
        },
        {
          "event": "ModifyLiquidity(bytes32 indexed id,address indexed sender,int24 tickLower,int24 tickUpper,int256 liquidityDelta,bytes32 salt)"
        }
      ]
    },
    {
      "name": "Treasury",
      "events": [
        {
          "event": "IncomeAllocated(address indexed asset,uint256 received,uint256 buybackAmount,uint256 opsAmount)"
        },
        {
          "event": "OpsClaimed(address indexed asset,address indexed recipient,uint256 amount)"
        },
        {
          "event": "ProtocolBuybackProcessed(address indexed quoteAsset,uint256 quoteSpent,uint256 tokensLocked,uint256 unspent)"
        }
      ]
    },
    {
      "name": "ProFactory",
      "events": [
        {
          "event": "GraduationInfrastructureConfigured(address indexed registry,bytes32 codeHash)"
        },
        {
          "event": "LaunchCreated(address indexed creator,address indexed token,address indexed curveAddress,address policy,uint256 supply,bytes32 configurationHash,bytes32 launchSalt,(string name,string symbol,string description,string image,string website,string twitter,string telegram) metadata,(address quoteAsset,uint256 phantomQuote,uint256 graduationThreshold,uint16 baseFeeBps,uint16 buyTaxBps,uint16 sellTaxBps,bool perpetual,address feeRecipient) curveConfig,(uint8 rule,bytes data)[] rules,address[] walletExemptions,bytes32 requestedSalt,uint64 deadline)"
        }
      ]
    },
    {
      "name": "ProSwapRouter",
      "events": [
        {
          "event": "ProPoolTrade(address indexed token,address indexed trader,bytes32 indexed poolId,address recipient,address quoteAsset,bool buy,uint256 amountSpent,uint256 amountOut)"
        }
      ]
    },
    {
      "name": "ProCurve",
      "events": [
        {
          "event": "ProBuy(address indexed buyer,address indexed recipient,uint256 tokensOut,uint256 spent,uint256 refund,uint256 fees)"
        },
        {
          "event": "ProSell(address indexed seller,address indexed recipient,uint256 tokensIn,uint256 quoteOut,uint256 fees)"
        },
        {
          "event": "CurveCompleted(address indexed token,uint256 quoteReserve,uint256 tokenReserve)"
        },
        {
          "event": "FeesSwept(address indexed recipient,uint256 amount)"
        }
      ]
    },
    {
      "name": "ProToken",
      "events": [
        {
          "event": "Transfer(address indexed from,address indexed to,uint256 value)"
        }
      ]
    },
    {
      "name": "ProPolicy",
      "events": [
        {
          "event": "WalletRegistered(address indexed wallet)"
        },
        {
          "event": "RulesDeactivated(address indexed token,address indexed registry)"
        }
      ]
    },
    {
      "name": "ProConsentRegistry",
      "events": [
        {
          "event": "ReactiveParticipantRegistered(bytes32 indexed participantId,address indexed token,address indexed creator,bytes32 configurationHash,uint8 role,bytes32 participantSalt)"
        },
        {
          "event": "ParticipantNonceAdvanced(bytes32 indexed participantId,address indexed creator,uint256 nonce)"
        },
        {
          "event": "ReactiveConsentFinalized(bytes32 indexed finalPairId,bytes32 indexed participantId0,bytes32 indexed participantId1,address token0,address token1,address creator0,address creator1,uint256 nonce0,uint256 nonce1)"
        }
      ]
    },
    {
      "name": "ProGraduationRegistry",
      "events": [
        {
          "event": "GraduatingLaunchRegistered(address indexed token,address indexed curve,address indexed policy,bytes32 configurationHash,bytes32 poolId)"
        },
        {
          "event": "ReservesRecorded(address indexed token,uint256 quoteAmount,uint256 tokenAmount)"
        },
        {
          "event": "GraduationPending(address indexed token,bytes reason)"
        },
        {
          "event": "GraduationCompleted(address indexed token,bytes32 indexed poolId,uint256 indexed positionId,uint128 liquidity,uint256 quoteUsed,uint256 tokensUsed)"
        }
      ]
    },
    {
      "name": "TerminalRouter",
      "events": [
        {
          "event": "Trade(address indexed trader,address indexed tokenIn,address indexed tokenOut,address recipient,uint256 amountIn,uint256 amountOut)"
        }
      ]
    }
  ],
