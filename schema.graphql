  quoteVolume: BigInt!
  tradeCount: BigInt!
  cumulativeQuoteVolume: BigInt!
  cumulativeTradeCount: BigInt!
  openPriceQuoteX18: BigInt
  highPriceQuoteX18: BigInt
  lowPriceQuoteX18: BigInt
  closePriceQuoteX18: BigInt
}
# One row per token and block timestamp. The cumulative totals let the market
